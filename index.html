<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Ceremony 2025</title>
<style>
  /* Fullscreen video background */
  body, html {
    margin: 0;
    height: 100%;
    font-family: "Poppins", sans-serif;
    overflow-x: hidden;
    color: white;
  }
  #video-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
  }

  /* Overlay container */
  .overlay {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    backdrop-filter: brightness(0.6);
    padding: 20px;
  }

  h1 {
    font-size: 3em;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
    margin-bottom: 20px;
  }

  input {
    padding: 12px 20px;
    font-size: 18px;
    border-radius: 12px;
    border: none;
    margin-bottom: 20px;
    width: 300px;
    max-width: 80%;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }

  /* 3D button */
  .btn {
    padding: 14px 28px;
    font-size: 18px;
    color: white;
    background: linear-gradient(145deg,#ff6b6b,#ff3b3b);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 6px #c0392b;
    transition: 0.2s;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 10px #c0392b; }
  .btn:active { transform: translateY(2px); box-shadow: 0 4px #c0392b; }
</style>
</head>
<body>

<!-- Background video -->
<video id="video-bg" autoplay muted loop>
  <source src="Background_Animation.mp4" type="video/mp4">
  Your browser does not support HTML5 video.
</video>

<!-- Overlay content -->
<div class="overlay">
  <h1>🎓 Welcome to the Faculty of Engineering!</h1>
  <input type="text" id="nameInput" placeholder="Enter your name">
  <br>
  <button class="btn" onclick="generateCard()">Generate My Card</button>
</div>

<script>
function generateCard() {
  const name = document.getElementById("nameInput").value.trim();
  if(!name){
    alert("Please enter your name!");
    return;
  }

  // High-resolution canvas for download
  const canvas = document.createElement("canvas");
  canvas.width = 1080; // high-res width
  canvas.height = 800; // high-res height
  const ctx = canvas.getContext("2d");

  // Gradient background
  const gradient = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  gradient.addColorStop(0,"#FFDAB9");
  gradient.addColorStop(1,"#FFB6C1");
  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Optional: add logo if available
  // const logo = new Image();
  // logo.src = "logo.png";
  // logo.onload = () => { ctx.drawImage(logo, canvas.width - 200, 50, 150, 150); }

  // Add text
  ctx.fillStyle = "#1a1a1a";
  ctx.textAlign = "center";

  ctx.font = "bold 60px Poppins";
  ctx.fillText("Welcome to Faculty of Engineering!", canvas.width/2, 250);

  ctx.font = "50px Poppins";
  ctx.fillText(`Dear ${name},`, canvas.width/2, 400);

  ctx.font = "40px Poppins";
  ctx.fillText("We’re delighted to have you with us! 💫", canvas.width/2, 520);

  ctx.font = "28px Poppins";
  ctx.fillText("© 2025 Faculty of Engineering", canvas.width/2, 720);

  // Trigger download immediately
  const link = document.createElement("a");
  link.download = `welcome_${name}.png`;
  link.href = canvas.toDataURL();
  link.click();
}
</script>

</body>
</html>
